# ==============================================================================
# Production Nginx Configuration for OnBoarding Buddy Frontend
# High-performance static asset delivery with secure FastAPI API reverse proxy
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Embedded Docker DNS resolver (allows startup even if backend is temporarily restarting)
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

    # Root directory for static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Client Body & Timeout Constraints ---
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # --- Container Liveness / Readiness Healthcheck ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --- Static File Serving (/static/ rewrite support) ---
    # The application HTML references /static/style.css and /static/app.js
    location /static/ {
        rewrite ^/static/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Cache static assets ---
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Reverse Proxy: FastAPI Backend API ---
    location /api/ {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running AI queries and repository cloning
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;

        # Disable buffering for streaming LLM responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Reverse Proxy: FastAPI Swagger & ReDoc Documentation ---
    location /docs {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Single Page Application Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Custom Error Pages ---
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
