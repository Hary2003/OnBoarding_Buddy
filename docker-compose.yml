# ==============================================================================
# Production Docker Compose for OnBoarding Buddy
# Orchestrates FastAPI Python Backend + Nginx Frontend Reverse Proxy
# ==============================================================================

services:
  # --- Backend: FastAPI Service ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onboarding-buddy-backend
    restart: unless-stopped
    environment:
      - DOCKER_CONTAINER=true
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - ENABLE_DOCS=true
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/onboarding_buddy.db}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000,http://frontend
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - onboarding-network

  # --- Frontend: Nginx Static File Server & API Reverse Proxy ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboarding-buddy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - onboarding-network

# --- Shared Application Network ---
networks:
  onboarding-network:
    driver: bridge

# --- Persistent Backend Storage (SQLite db & logs fallback) ---
volumes:
  backend-data:
    driver: local
