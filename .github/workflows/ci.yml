name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: testing
          DEBUG: "false"
          HOST: 127.0.0.1
          PORT: 8000
          RAW_DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CLEAN_URL=$(python -c "import os; u = os.environ.get('RAW_DB_URL', '').strip(); u = u.split('=', 1)[1].strip() if u.startswith('DATABASE_URL=') else u; u = u.strip('\"\''); print(u)")
          export DATABASE_URL="$CLEAN_URL"
          python -m unittest discover tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t onboarding-buddy-backend:ci .

      - name: Build frontend image
        run: docker build -t onboarding-buddy-frontend:ci ./frontend
