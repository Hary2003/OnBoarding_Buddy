name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Security Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Lint with Flake8 (Syntax and Fatal Errors)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,build,dist

      - name: Security Check (.env and Secret Prevention)
        run: |
          # Ensure .env or secret credentials are not tracked by git
          if git ls-files | grep -E '^(\.env|\.env\.local|\.env\.production)$'; then
            echo "ERROR: Disallowed .env environment file tracked in git repository!"
            exit 1
          fi

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          DEBUG: "false"
          HOST: 127.0.0.1
          PORT: 8000
        run: |
          python -m unittest discover tests

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Containers & Validate Compose
        run: |
          docker build -t onboarding-buddy:ci .
          docker build -t onboarding-buddy-frontend:ci ./frontend
          docker compose config
